<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-box">
        <h1>Вход</h1>
        <div class="alert alert-error" th:if="${param.error}">Неверный логин или пароль.</div>
        <div class="alert alert-success" th:if="${param.logout}">Вы вышли из системы.</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" required autofocus/>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Войти</button>
        </form>
        <div class="auth-link">Нет аккаунта? <a th:href="@{/registration}">Зарегистрироваться</a></div>
    </div>
</div>
</body>
</html>
