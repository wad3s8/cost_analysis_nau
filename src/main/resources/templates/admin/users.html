<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Пользователи')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1>Управление пользователями</h1>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Роль</th>
                <th>Счетов</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.login}"></td>
                <td th:text="${u.firstName}"></td>
                <td th:text="${u.lastName}"></td>
                <td>
                    <span th:class="${u.role.name() == 'ADMIN' ? 'badge income' : 'badge'}"
                          th:text="${u.role}"></span>
                </td>
                <td th:text="${u.accounts != null ? #lists.size(u.accounts) : 0}"></td>
                <td>
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                          onsubmit="return confirm('Удалить пользователя?')"
                          sec:authorize="!authentication.name.equals(#vars.u.login)">
                        <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
